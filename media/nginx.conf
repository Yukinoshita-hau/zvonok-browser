server {
 listen 8080;
 server_name localhost 127.0.0.1;
 if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
 root /usr/share/nginx/html;
 add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://127.0.0.1:47833; media-src 'self' blob:; img-src 'self' blob:; style-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'" always;
 location /media/ {
   if ($http_origin ~* "^https?://(?!localhost(:[0-9]+)?$|127\.0\.0\.1(:[0-9]+)?$)") { return 403; }
   proxy_pass http://broker:3001/;
   client_max_body_size 1k;
   access_log off;
 }
 location /api/ { return 503; }
 location / { try_files $uri /index.html; }
}
