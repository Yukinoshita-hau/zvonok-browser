server {
 listen 8080;
 server_name localhost 127.0.0.1;
 if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
 root /usr/share/nginx/html;
 add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:*; media-src 'self' blob:; img-src 'self' blob:; style-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'" always;
 location /api/ {
   if ($http_origin !~ "^($|http://(localhost|127\.0\.0\.1):[0-9]{2,5}$)") { return 403; }
   proxy_pass http://api:3000/;
   proxy_read_timeout 25s;
   client_max_body_size 16k;
   access_log off;
 }
 location / { try_files $uri /index.html; }
}
