name: zvonok-browser-session
x-limits: &limits
  logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  init: true
  cpus: 2
  mem_limit: 512m
  pids_limit: 128
services:
  proxy:
    <<: *limits
    image: zvonok-browser-poc-proxy:latest
    networks:
      browser: {ipv4_address: "${BROWSER_PROXY_IP:-172.30.87.2}"}
      outbound: {}
    sysctls: {net.ipv4.ip_forward: "0"}
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
  guard:
    image: zvonok-browser-session-guard:2b2
    build: {context: ., dockerfile: infra/Dockerfile.guard}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes: [guard-state:/guard]
    environment: {BROWSER_PROXY_IP: "${BROWSER_PROXY_IP:-172.30.87.2}"}
    tmpfs: [/run]
    mem_limit: 32m
    pids_limit: 16
    networks:
      browser: {ipv4_address: "${BROWSER_GUARD_IP:-172.30.87.3}"}
    healthcheck:
      test: [CMD-SHELL, 'test "$(cat /guard/ready)" = firewall-v1 && iptables -C OUTPUT -d ${BROWSER_PROXY_IP:-172.30.87.2} -p tcp --dport 3128 -j ACCEPT']
      interval: 2s
      timeout: 1s
      retries: 15
  worker:
    <<: *limits
    image: zvonok-browser-session-worker:2b2
    build: {context: ., dockerfile: Dockerfile, target: worker}
    network_mode: service:guard
    depends_on:
      guard: {condition: service_healthy}
      proxy: {condition: service_started}
      broker: {condition: service_healthy}
    volumes: [control:/control, binding:/binding, frames:/frames, guard-state:/guard:ro, "./artifacts/stages/browser-activity-audio-audit:/diagnostics"]
    security_opt: [no-new-privileges:true, "seccomp=./infra/seccomp.json"]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    shm_size: 256m
    mem_limit: 1024m
    pids_limit: 256
    stop_grace_period: 15s
    restart: unless-stopped
    environment:
      BROWSER_LIVE: "1"
      BROWSER_CONTROL_SOCKET: /control/worker.sock
      BROWSER_BINDING_SOCKET: /binding/broker.sock
      BROWSER_TOKEN_SOCKET: /auth/token.sock
      BROWSER_DISPLAY: ':91'
      BROWSER_PROXY: "http://${BROWSER_PROXY_IP:-172.30.87.2}:3128"
      BROWSER_FIXTURE: "${BROWSER_FIXTURE:-0}"
      BROWSER_MEDIA_PROFILE: "${BROWSER_MEDIA_PROFILE:-}"
      MEDIA_FPS: "${MEDIA_FPS:-15}"
      BROWSER_AUDIO: "${BROWSER_AUDIO:-1}"
      BROWSER_AUDIO_DIAGNOSTICS: "${BROWSER_AUDIO_DIAGNOSTICS:-0}"
      IDLE_MS: "${SESSION_IDLE_MS:-300000}"
      TTL_MS: "${SESSION_TTL_MS:-1200000}"
      XDG_CONFIG_HOME: /tmp/browser-config
      XDG_CACHE_HOME: /tmp/browser-cache
  worker-2:
    <<: *limits
    image: zvonok-browser-session-worker:2b2
    build: {context: ., dockerfile: Dockerfile, target: worker}
    network_mode: service:guard
    depends_on:
      guard: {condition: service_healthy}
      proxy: {condition: service_started}
      broker-2: {condition: service_healthy}
    volumes: [control:/control, binding-2:/binding, frames-2:/frames, guard-state:/guard:ro, "./artifacts/stages/browser-activity-audio-audit:/diagnostics"]
    security_opt: [no-new-privileges:true, "seccomp=./infra/seccomp.json"]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    shm_size: 256m
    mem_limit: 1024m
    pids_limit: 256
    stop_grace_period: 15s
    restart: unless-stopped
    environment:
      BROWSER_LIVE: "1"
      BROWSER_CONTROL_SOCKET: /control/worker-2.sock
      BROWSER_BINDING_SOCKET: /binding/broker-2.sock
      BROWSER_TOKEN_SOCKET: /auth/token-2.sock
      BROWSER_DISPLAY: ':92'
      BROWSER_PROXY: "http://${BROWSER_PROXY_IP:-172.30.87.2}:3128"
      BROWSER_FIXTURE: "${BROWSER_FIXTURE:-0}"
      BROWSER_MEDIA_PROFILE: "${BROWSER_MEDIA_PROFILE:-}"
      MEDIA_FPS: "${MEDIA_FPS:-15}"
      BROWSER_AUDIO: "${BROWSER_AUDIO:-1}"
      BROWSER_AUDIO_DIAGNOSTICS: "${BROWSER_AUDIO_DIAGNOSTICS:-0}"
      IDLE_MS: "${SESSION_IDLE_MS:-300000}"
      TTL_MS: "${SESSION_TTL_MS:-1200000}"
      XDG_CONFIG_HOME: /tmp/browser-config
      XDG_CACHE_HOME: /tmp/browser-cache
  api:
    <<: *limits
    image: zvonok-browser-session-api:2b2
    build: {context: ., dockerfile: Dockerfile, target: api}
    networks: [control, authnet]
    volumes: [control:/control]
    environment:
      BROWSER_INTEGRATION_KEY: "${BROWSER_INTEGRATION_KEY:?Set a dedicated integration key with at least 43 characters}"
      BROWSER_WORKER_SOCKETS: /control/worker.sock,/control/worker-2.sock
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    depends_on: [worker, worker-2]
  client:
    <<: *limits
    image: zvonok-browser-session-client:2b2
    build: {context: ., dockerfile: Dockerfile, target: client}
    volumes: ["./session/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [control, edge]
    ports: ["127.0.0.1:${BROWSER_HTTP_PORT:-48031}:8080"]
    tmpfs: [/tmp]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 32
    depends_on: [api]
  livekit:
    <<: *limits
    image: livekit/livekit-server:v1.9.12
    user: "1000:1000"
    command: ["--config", "/config/livekit.yaml"]
    volumes: ["./session/livekit.local.yaml:/config/livekit.yaml:ro"]
    ports: ["127.0.0.1:${BROWSER_LIVEKIT_PORT:-48034}:47836"]
    networks: [media, rtc-edge]
  broker:
    <<: *limits
    image: zvonok-browser-session-media:2b2
    build: {context: ., dockerfile: session/Dockerfile.media}
    command: [node, session-broker.mjs]
    volumes: [binding:/binding, auth:/auth, "./session/livekit.local.yaml:/secrets/livekit.yaml:ro"]
    networks: [authnet, media, edge]
    restart: unless-stopped
    ports: ["127.0.0.1:${BROWSER_BROKER_PORT:-48033}:3002"]
    environment:
      BROWSER_SIGNALING_URL: "ws://127.0.0.1:${BROWSER_BROKER_PORT:-48033}"
    mem_limit: 128m
    depends_on: [livekit]
    healthcheck:
      test: [CMD, node, -e, "require('fs').accessSync('/binding/broker.sock');require('fs').accessSync('/auth/token.sock')"]
      interval: 2s
      timeout: 1s
      retries: 15
  publisher:
    <<: *limits
    image: zvonok-browser-session-media:2b2
    network_mode: service:livekit
    depends_on:
      broker: {condition: service_healthy}
    volumes: [auth:/auth, frames:/frames, "./artifacts/stages/browser-activity-audio-audit:/diagnostics"]
    environment: {BROWSER_AUDIO: "${BROWSER_AUDIO:-1}", BROWSER_AUDIO_DIAGNOSTICS: "${BROWSER_AUDIO_DIAGNOSTICS:-0}"}
    stop_grace_period: 12s
    restart: unless-stopped
  broker-2:
    <<: *limits
    image: zvonok-browser-session-media:2b2
    build: {context: ., dockerfile: session/Dockerfile.media}
    command: [node, session-broker.mjs]
    volumes: [binding-2:/binding, auth-2:/auth, "./session/livekit.local.yaml:/secrets/livekit.yaml:ro"]
    networks: [authnet, media, edge]
    restart: unless-stopped
    ports: ["127.0.0.1:${BROWSER_BROKER_2_PORT:-48039}:3002"]
    mem_limit: 128m
    depends_on: [livekit]
    environment:
      BROWSER_BINDING_SOCKET: /binding/broker-2.sock
      BROWSER_TOKEN_SOCKET: /auth/token-2.sock
      BROWSER_SIGNALING_URL: "ws://127.0.0.1:${BROWSER_BROKER_2_PORT:-48039}"
    healthcheck:
      test: [CMD, node, -e, "require('fs').accessSync('/binding/broker-2.sock');require('fs').accessSync('/auth/token-2.sock')"]
      interval: 2s
      timeout: 1s
      retries: 15
  publisher-2:
    <<: *limits
    image: zvonok-browser-session-media:2b2
    build: {context: ., dockerfile: session/Dockerfile.media}
    network_mode: service:livekit
    depends_on:
      broker-2: {condition: service_healthy}
    volumes: [auth-2:/auth, frames-2:/frames, "./artifacts/stages/browser-activity-audio-audit:/diagnostics"]
    environment:
      BROWSER_AUDIO: "${BROWSER_AUDIO:-1}"
      BROWSER_AUDIO_DIAGNOSTICS: "${BROWSER_AUDIO_DIAGNOSTICS:-0}"
      BROWSER_TOKEN_SOCKET: /auth/token-2.sock
    stop_grace_period: 12s
    restart: unless-stopped
  rtc-relay:
    <<: *limits
    image: zvonok-browser-session-media:2b2
    command: [node, session-relay.mjs]
    network_mode: service:livekit
    depends_on: [livekit]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
networks:
  browser:
    internal: true
    ipam: {config: [{subnet: "${BROWSER_SUBNET:-172.30.87.0/24}"}]}
  control: {internal: true}
  authnet: {internal: true}
  media: {internal: true}
  outbound: {}
  edge: {}
  rtc-edge: {}
volumes:
  guard-state: {}
  control: {}
  binding: {}
  frames: {}
  auth: {}
  binding-2: {}
  frames-2: {}
  auth-2: {}
